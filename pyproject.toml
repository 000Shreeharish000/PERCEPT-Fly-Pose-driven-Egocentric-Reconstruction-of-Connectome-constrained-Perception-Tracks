[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egoflynet"
version = "0.1.0"
description = "EgoFlyNet: Pose-driven egocentric visual reconstruction for Drosophila with connectome-constrained perception"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shree Harish V" }]
keywords = ["drosophila", "neuroscience", "vision", "connectome", "pose-tracking", "egocentric", "flyvis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
flyvis = [
    "flyvis>=0.1.0",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "h5py>=3.8",
]

[project.scripts]
egoflynet = "egoflynet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
